<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Gap Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Skill Gap Analyzer</h1>
        <p>Discover the skills you need for your dream career.</p>

        <form action="/analyze" method="POST">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="skills">Your Current Skills</label>
            <textarea id="skills" name="skills" rows="4"
                      placeholder="Example: Python, SQL, HTML, CSS"
                      required></textarea>

            <label for="target_job">Choose Your Target Job</label>
            <select id="target_job" name="target_job" required>
                <option value="">-- Select a Job Role --</option>
                {% for role in job_roles %}
                    <option value="{{ role }}">{{ role }}</option>
                {% endfor %}
            </select>

            <button type="submit">Analyze My Skills</button>
        </form>
    </div>
</body>
</html>
